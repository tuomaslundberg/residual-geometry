[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "residual-geometry"
version = "0.2.0"
description = "Language-signal removal and residual characterisation in multilingual sentence encoders"
requires-python = ">=3.10"
dependencies = [
    "sentence-transformers>=3.0",
    "scikit-learn>=1.4",
    "scikit-dimension>=0.3",
    "scipy>=1.12",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
vis = [
    "umap-learn>=0.5",
    "matplotlib>=3.8",
]
leace = [
    "concept-erasure>=0.4",  # Belrose et al. 2023; installs separately on LUMI
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
